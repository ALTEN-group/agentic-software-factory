<svg width="192" height="40" viewBox="0 0 192 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=Inter:wght@400;500;700&amp;display=swap');
      .brand-title { fill: #1D4ED8; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; letter-spacing: 0.08em; }
      .brand-subtitle { fill: #475569; font-family: 'Inter', system-ui, sans-serif; font-weight: 500; letter-spacing: 0.12em; }
      @media (prefers-color-scheme: dark) {
        .brand-title { fill: #60A5FA; }
        .brand-subtitle { fill: #94A3B8; }
      }
    </style>
    <linearGradient id="isoTop" x1="6" y1="5" x2="34" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="isoLeft" x1="6" y1="13" x2="20" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="isoRight" x1="20" y1="13" x2="34" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cyanCore" x1="16" y1="16" x2="24" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- ISOMETRIC FACTORY-MONOGRAM EMBLEM (40x40) -->
  <g transform="translate(0, 1)">
    <!-- Isometric Top Roof Plane (Sawtooth Factory Pattern) -->
    <path d="M20 3L35 11.5L28 15.5L20 11L12 15.5L5 11.5L20 3Z" fill="url(#isoTop)"/>
    <path d="M20 3L35 11.5L28 15.5L20 11L12 15.5L5 11.5L20 3Z" stroke="#93C5FD" stroke-width="0.75" stroke-linejoin="round"/>

    <!-- Left Architectural Facet -->
    <path d="M5 11.5L20 20V37L5 28.5V11.5Z" fill="url(#isoLeft)"/>

    <!-- Right Architectural Facet -->
    <path d="M20 20L35 11.5V28.5L20 37V20Z" fill="url(#isoRight)"/>

    <!-- Center Cutout: Glowing Autonomous Delta Conduit (The 'A') -->
    <path d="M20 13L29 28H23L20 23L17 28H11L20 13Z" fill="url(#cyanCore)"/>
    <!-- Delta Core Cross-bar / Energy Node -->
    <polygon points="20,18 22.5,23 17.5,23" fill="#FFFFFF"/>
    
    <!-- Fine Structural Isometric Seams -->
    <line x1="20" y1="11" x2="20" y2="37" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6"/>
  </g>

  <!-- TYPOGRAPHY: Technical Precision Monogram -->
  <text x="45" y="21" class="brand-title" font-size="14.5">AGENTIC</text>
  <text x="45" y="33" class="brand-subtitle" font-size="9.8">SOFTWARE FACTORY</text>
</svg>
